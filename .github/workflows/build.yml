name: Build EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Go Application
      run: |
        mkdir dist
        cd wos_mcp_go
        go mod tidy
        go build -o ..\dist\wos_mcp.exe

    - name: Prepare Release Folder
      run: |
        copy wos_mcp_go\config.example.json dist\config.json

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WOS_MCP-Windows
        path: dist/
